name: build

on:
  push:
    branches: [main]
    paths: [versions.env, locks/**, scripts/**, docker/**, tests/**, Dockerfile, .github/workflows/build.yml]
  pull_request:
    paths: [versions.env, locks/**, scripts/**, docker/**, tests/**, Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      reason:
        description: Why this build runs (upstream = new PBS release, opens a ready-to-release issue)
        default: manual

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dasunnimantha/pbs-arm64 # image names must be lowercase
  DEBIAN_IMAGE: debian:trixie-20261020-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad

jobs:
  pins:
    runs-on: ubuntu-24.04-arm
    outputs:
      rust_image: ${{ steps.p.outputs.rust_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: p
        run: echo "rust_image=$(sed -n 's/^RUST_IMAGE=//p' versions.env)" >> "$GITHUB_OUTPUT"

  debs:
    needs: pins
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    container:
      # official Rust image (Debian trixie) at the rustc version Proxmox builds PBS with; pinned in versions.env
      image: ${{ needs.pins.outputs.rust_image }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      new_locks: ${{ steps.locks.outputs.new }}
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -yq --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          . ./versions.env
          echo "version=$PBS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Proxmox Backup Server $PBS_VERSION ($PBS_COMMIT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build packages
        run: scripts/build.sh /tmp/work out
      - id: locks
        name: Detect newly generated lockfiles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain -- locks)" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locks
          path: locks/
          if-no-files-found: error

  image:
    needs: debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debs
          path: debs/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # OCI archive keeps the SBOM + provenance attestations; release.yml pushes this exact archive
      - name: Build image (OCI archive with SBOM + provenance)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          provenance: mode=max
          sbom: true
          outputs: type=oci,dest=image.oci.tar
          build-args: |
            PBS_VERSION=${{ needs.debs.outputs.version }}
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
      - name: Load the archive into docker
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          skopeo copy oci-archive:image.oci.tar docker-daemon:pbs-arm64:test
      - name: Integration tests
        run: tests/integration.sh pbs-arm64:test debs/proxmox-backup-client-static_*_arm64.deb
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.oci.tar
          if-no-files-found: error
          compression-level: 0
      - name: Summary
        env:
          V: ${{ needs.debs.outputs.version }}
        run: |
          {
            echo "### PBS $V built and tested ✅"
            echo
            echo "Nothing has been published. To publish this exact build:"
            echo
            echo '```'
            echo "gh workflow run release.yml -f run_id=${{ github.run_id }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  notify:
    needs: [debs, image]
    if: github.event_name == 'workflow_dispatch' && inputs.reason == 'upstream'
    runs-on: ubuntu-24.04-arm
    permissions:
      issues: write
    steps:
      - name: Open a ready-to-release issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          V: ${{ needs.debs.outputs.version }}
        run: |
          gh issue create --title "PBS $V is built and tested: ready to release" --body "Proxmox released PBS $V. It was built and passed the integration tests in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.

          Publish it with:

              gh workflow run release.yml -f run_id=${{ github.run_id }}

          or from Actions → release → Run workflow."
