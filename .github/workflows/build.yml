name: build

on:
  push:
    branches: [main]
    paths: [versions.env, locks/**, scripts/**, docker/**, tests/**, Dockerfile, .github/workflows/build.yml]
  pull_request:
    paths: [versions.env, locks/**, scripts/**, docker/**, tests/**, Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dasunnimantha/pbs-arm64 # image names must be lowercase
  DEBIAN_IMAGE: debian:trixie-20261020-slim@sha256:62bd423aeee912639ca8ee681c2b762cb3e25137e0a92b20be455898a9f034ad

jobs:
  pins:
    runs-on: ubuntu-24.04-arm
    outputs:
      rust_image: ${{ steps.p.outputs.rust_image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: p
        run: echo "rust_image=$(sed -n 's/^RUST_IMAGE=//p' versions.env)" >> "$GITHUB_OUTPUT"

  debs:
    needs: pins
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    container:
      # official Rust image (Debian trixie) at the rustc version Proxmox builds PBS with; pinned in versions.env
      image: ${{ needs.pins.outputs.rust_image }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      new_locks: ${{ steps.locks.outputs.new }}
    steps:
      - name: Install git
        run: apt-get update -q && apt-get install -yq --no-install-recommends git ca-certificates
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: |
          . ./versions.env
          echo "version=$PBS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Building Proxmox Backup Server $PBS_VERSION ($PBS_COMMIT)" >> "$GITHUB_STEP_SUMMARY"
      - name: Build packages
        run: scripts/build.sh /tmp/work out
      - id: locks
        name: Detect newly generated lockfiles
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ -n "$(git status --porcelain -- locks)" ]; then echo "new=true" >> "$GITHUB_OUTPUT"; else echo "new=false" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: debs
          path: out/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locks
          path: locks/
          if-no-files-found: error

  image:
    needs: debs
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debs
          path: debs/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image for smoke test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: pbs-arm64:test
          build-args: |
            PBS_VERSION=${{ needs.debs.outputs.version }}
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
      - name: Integration tests (gate before publishing)
        run: tests/integration.sh pbs-arm64:test debs/proxmox-backup-client-static_*_arm64.deb
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        name: Push image
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.IMAGE }}:${{ needs.debs.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.debs.outputs.version }}-${{ github.run_number }}
            ${{ env.IMAGE }}:latest
          build-args: |
            PBS_VERSION=${{ needs.debs.outputs.version }}
            DEBIAN_IMAGE=${{ env.DEBIAN_IMAGE }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: steps.push.outcome == 'success'
      - name: Sign image
        if: steps.push.outcome == 'success'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"

  release:
    needs: [debs, image]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: debs
          path: debs/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.debs.outputs.new_locks == 'true'
        with:
          name: locks
          path: locks/
      - name: Commit newly generated lockfiles
        if: needs.debs.outputs.new_locks == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add locks
          git commit -m "Add lockfiles for PBS ${{ needs.debs.outputs.version }}"
          git push
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V: ${{ needs.debs.outputs.version }}
        run: |
          tag="v$V-${{ github.run_number }}"
          notes="Proxmox Backup Server $V for arm64, built from official source.

          Image: \`${IMAGE}:$V\` (also \`$V-${{ github.run_number }}\`), signed with cosign (keyless, this workflow).
          Pins: see \`versions.env\` at this tag."
          gh release create "$tag" debs/* --title "PBS $V (build ${{ github.run_number }})" --notes "$notes" --latest
