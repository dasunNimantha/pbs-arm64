name: release

# Manual only: publish a build that already passed the integration tests in build.yml.
# Nothing is rebuilt; the exact tested OCI archive (with its SBOM + provenance) is pushed.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: build.yml run to publish (empty = latest successful build on main)
        required: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/dasunnimantha/pbs-arm64

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    permissions:
      contents: write  # GitHub release + lockfile commit
      packages: write  # push to GHCR
      id-token: write  # keyless cosign signing
      actions: read    # download artifacts from the build run
    steps:
      - name: Select the build run
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh run list --workflow build.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          info=$(gh run view "$RUN_ID" --json conclusion,headBranch,headSha,event,workflowName,number)
          echo "$info"
          [ "$(jq -r .workflowName <<<"$info")" = build ] || { echo "::error::run $RUN_ID is not a build run"; exit 1; }
          [ "$(jq -r .conclusion <<<"$info")" = success ] || { echo "::error::run $RUN_ID did not succeed"; exit 1; }
          [ "$(jq -r .headBranch <<<"$info")" = main ] || { echo "::error::run $RUN_ID is not from main"; exit 1; }
          [ "$(jq -r .event <<<"$info")" != pull_request ] || { echo "::error::refusing to publish a pull request build"; exit 1; }
          echo "id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$(jq -r .headSha <<<"$info")" >> "$GITHUB_OUTPUT"
          echo "number=$(jq -r .number <<<"$info")" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Check the build is from the current main
        run: |
          git merge-base --is-ancestor "${{ steps.run.outputs.sha }}" HEAD ||
            { echo "::error::build commit is not on main"; exit 1; }
          . <(git show "${{ steps.run.outputs.sha }}:versions.env")
          echo "VERSION=$PBS_VERSION" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: artifacts/
      - name: Check artifacts
        run: |
          ls -la artifacts/*/
          test -s artifacts/image/image.oci.tar
          (cd artifacts/debs && sha256sum -c SHA256SUMS)
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the tested image
        id: push
        env:
          BUILD: ${{ steps.run.outputs.number }}
        run: |
          command -v skopeo >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq skopeo; }
          auth=$HOME/.docker/config.json
          skopeo copy --all --authfile "$auth" oci-archive:artifacts/image/image.oci.tar "docker://$IMAGE:$VERSION-$BUILD"
          for tag in "$VERSION" latest; do
            skopeo copy --all --authfile "$auth" "docker://$IMAGE:$VERSION-$BUILD" "docker://$IMAGE:$tag"
          done
          digest=$(skopeo inspect --authfile "$auth" --format '{{.Digest}}' "docker://$IMAGE:$VERSION-$BUILD")
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        run: cosign sign --yes "$IMAGE@${{ steps.push.outputs.digest }}"
      - name: Commit this version's lockfiles (if new)
        run: |
          rm -rf locks && cp -r artifacts/locks locks
          if [ -n "$(git status --porcelain -- locks)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add locks
            git commit -m "Add lockfiles for PBS $VERSION"
            git push
          fi
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD: ${{ steps.run.outputs.number }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          tag="v$VERSION-$BUILD"
          notes="Proxmox Backup Server $VERSION for arm64, built from official source.

          - Image: \`$IMAGE:$VERSION\` / \`$IMAGE:$VERSION-$BUILD\` (\`$DIGEST\`)
          - Signed with cosign (keyless, this repo's release workflow); SBOM + provenance attached
          - Built and tested in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ steps.run.outputs.id }}
          - Source pins: \`versions.env\` at ${{ steps.run.outputs.sha }}"
          gh release create "$tag" artifacts/debs/* --target "${{ steps.run.outputs.sha }}" \
            --title "PBS $VERSION (build $BUILD)" --notes "$notes" --latest
          echo "Published \`$IMAGE:$VERSION\` (\`$DIGEST\`) and release $tag" >> "$GITHUB_STEP_SUMMARY"
