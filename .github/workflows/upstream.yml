name: upstream

# Daily: if Proxmox tagged a new proxmox-backup release, re-pin all sources, build and test it,
# and open a ready-to-release issue. Publishing stays manual (release.yml).
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write # commit the new versions.env
      actions: write  # start the build workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pin
        run: |
          current=$(sed -n 's/^PBS_VERSION=//p' versions.env)
          scripts/pin.sh
          latest=$(sed -n 's/^PBS_VERSION=//p' versions.env)
          echo "current=$current latest=$latest"
          if [ "$current" = "$latest" ]; then
            git checkout -- versions.env
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and build
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions.env
          git commit -m "Update to Proxmox Backup Server ${{ steps.pin.outputs.version }}"
          git push
          # pushes made with GITHUB_TOKEN don't trigger workflows; start the build explicitly
          gh workflow run build.yml --ref main -f reason=upstream
